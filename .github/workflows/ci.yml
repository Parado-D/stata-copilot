name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18.20', '20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - name: Syntax check
        run: |
          for f in src/*.mjs bin/*.mjs test/*.mjs; do node --check "$f"; done
      - name: Offline tests (parsers, policy, protocol, tool contracts)
        run: node test/offline.mjs

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18.20', '20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - name: Syntax check
        run: find src bin test -name '*.mjs' -print0 | xargs -0 -n1 node --check
      - name: Contract tests (module graph, tool definitions, config)
        run: node test/contracts.mjs
      - name: Offline tests (parsers, policy, protocol, tool behaviour)
        run: node test/offline.mjs
